---
layout: default
title: Beställning
---

<div class="page-wrapper">
  <section class="hero">
    <div class="hero-inner">
      <h1>Beställ din 3D-printade hjälm</h1>
      <p class="lead">Fyll i formuläret nedan och betala säkert via PayPal. Vi bekräftar din beställning via e-post.</p>
    </div>
  </section>

  <section style="max-width: 600px; margin: 2rem auto;">
    <form id="orderForm">
      
      <div class="form-group">
        <label for="product">Produkt *</label>
        <select id="product" name="product" required>
          <option value="">Välj produkt...</option>
          <option value="Boba Fett Hjälm - 1600">Boba Fett Hjälm - 1600 kr</option>
          <option value="Darth Vader Hjälm - 1500">Darth Vader Hjälm - 1500 kr</option>
          <option value="Clone Trooper Phase 1 - 1500">Clone Trooper Phase 1 - 1500 kr</option>
          <option value="The Mandalorian - 1500">The Mandalorian - 1500 kr</option>
          <option value="Captain Rex - 1800">Captain Rex - 1800 kr</option>
        </select>
      </div>

      <div class="form-group">
        <label for="material">Material *</label>
        <select id="material" name="material" required>
          <option value="">Välj material...</option>
          <option value="PLA (Standard)">PLA (Standard)</option>
          <option value="PETG (Slagtåligt)">PETG (Slagtåligt)</option>
          <option value="ABS (Värmetåligt)">ABS (Värmetåligt)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="size">Storlek *</label>
        <select id="size" name="size" required>
          <option value="">Välj storlek...</option>
          <option value="Standard (Vuxen 1:1)">Standard (Vuxen 1:1)</option>
          <option value="Display / Barn">Display / Barn</option>
        </select>
      </div>

      <div class="form-group">
        <label for="quantity">Antal *</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required>
      </div>

      <div class="form-group">
        <label for="name">Ditt namn *</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">E-post *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Telefon</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div class="form-group">
        <label for="message">Särskilda önskemål / Noteringar</label>
        <textarea id="message" name="message" rows="4"></textarea>
      </div>

      <div class="form-group" style="background: rgba(34, 197, 94, 0.1); padding: 1rem; border-radius: 8px; border: 1px solid rgba(34, 197, 94, 0.3); margin-bottom: 1.5rem;">
        <p style="margin: 0 0 0.5rem 0; font-weight: 600; color: #f9fafb;">Totalpris: <span id="totalPrice" style="color: var(--accent);">0 kr</span></p>
        <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">Priset uppdateras när du väljer produkt och antal</p>
      </div>

      <button type="button" id="paypalBtn" class="btn-primary" style="width: 100%; padding: 0.7rem; margin-bottom: 1rem;">
        💳 Betala via PayPal
      </button>

      <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">
        Eller skicka en enkel förfrågan utan betalning:
      </p>

      <button type="submit" class="btn-secondary" style="width: 100%; padding: 0.7rem;">
        📧 Skicka förfrågan (utan betalning)
      </button>
    </form>
  </section>
</div>

<style>
  .form-group {
    margin-bottom: 1.5rem;
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: #e5e7eb;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 0.6rem;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid #1f2937;
    border-radius: 6px;
    color: #e5e7eb;
    font-family: inherit;
    font-size: 1rem;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
  }
</style>

<script>
  // Uppdatera totalpriset när produkt eller antal ändras
  function updatePrice() {
    const product = document.getElementById('product').value;
    const quantity = parseInt(document.getElementById('quantity').value) || 1;
    
    if (!product) {
      document.getElementById('totalPrice').textContent = '0 kr';
      return;
    }
    
    const price = parseInt(product.match(/\d+/)[0]) * quantity;
    document.getElementById('totalPrice').textContent = price + ' kr';
  }

  document.getElementById('product').addEventListener('change', updatePrice);
  document.getElementById('quantity').addEventListener('change', updatePrice);

  // PayPal-knappens funktionalitet
  document.getElementById('paypalBtn').addEventListener('click', function(e) {
    e.preventDefault();
    
    const product = document.getElementById('product').value;
    const quantity = parseInt(document.getElementById('quantity').value) || 1;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    if (!product) {
      alert('Välj en produkt först!');
      return;
    }

    if (!name || !email) {
      alert('Fyll i namn och e-post!');
      return;
    }

    const price = parseInt(product.match(/\d+/)[0]) * quantity;
    
    // Omdirigera till PayPal.me med pris och notering
    const note = encodeURIComponent(`${product} (x${quantity}) - ${name}`);
    window.location.href = `https://www.paypal.me/sweprint3d/${price}?note=${note}`;
  });

  // Formulär-submission (enkel förfrågan via email)
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const product = document.getElementById('product').value;
    const material = document.getElementById('material').value;
    const size = document.getElementById('size').value;
    const quantity = document.getElementById('quantity').value;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const message = document.getElementById('message').value;

    const body = encodeURIComponent(
      `Beställningsförfrågan\n\n` +
      `Namn: ${name}\n` +
      `E-post: ${email}\n` +
      `Telefon: ${phone}\n\n` +
      `Produkt: ${product}\n` +
      `Material: ${material}\n` +
      `Storlek: ${size}\n` +
      `Antal: ${quantity}\n\n` +
      `Noteringar:\n${message}`
    );

    window.location.href = `mailto:sweprint3d@gmail.com?subject=Beställningsförfrågan: ${product}&body=${body}`;
  });
</script>
