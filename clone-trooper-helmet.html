<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone Trooper Hjälm – SwePrint3D</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-image img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 1rem; display: block; }
        .product-container { display: flex; flex-wrap: wrap; gap: 2rem; margin-top: 2rem; }
        .product-image, .product-details { flex: 1; min-width: 300px; }
        .option-group { margin-bottom: 1.2rem; }
        .option-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
        .option-group select, .option-group input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.jpg" alt="SwePrint3D Logo" style="width:50px; height:50px; border-radius:50%;"></div>
        <nav><ul><li><a href="index.html">Hem</a></li><li><a href="butik.html">Butik</a></li><li><a href="priser-och-faq.html">Priser & FAQ</a></li></ul></nav>
    </header>
    <main class="product-page">
        <div class="product-container">
            <div class="product-image">
                <img src="images/clone-trooper-helmet1.jpg" alt="Clone front">
            </div>
            <div class="product-details">
                <h1>Clone Trooper Hjälm</h1>
                <p class="product-description">Phase II Clone Trooper. Kraftig och detaljerad konstruktion.</p>
                <div class="option-group">
                    <label for="material">Material:</label>
                    <select id="material">
                        <option value="pla">PLA</option>
                        <option value="petg">PETG</option>
                        <option value="abs">ABS</option>
                    </select>
                </div>
                <div class="option-group">
                    <label for="color">Färg:</label>
                    <select id="color">
                        <option value="vit">Vit</option>
                        <option value="gra">Grå</option>
                    </select>
                </div>
                <p class="pricing-note">Pris från 1 300 kr.</p>
                <button class="contact-button" onclick="location.href='mailto:sweprint3d@gmail.com?subject=Förfrågan: Clone'" style="padding: 10px 20px; background: #111827; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold;">Kontakta för beställning</button>
            </div>
        </div>
    </main>
</body>
</html>
