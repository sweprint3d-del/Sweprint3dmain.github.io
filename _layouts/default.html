<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} – SwePrint3D</title>
  <style>
    /* Här lägger vi den gemensamma designen */
    body { margin: 0; font-family: sans-serif; background: #f3f4f6; color: #111827; }
    header, main, footer { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-weight: bold; }
    .brand img { height: 40px; }
    nav a { margin-left: 1rem; text-decoration: none; color: #4b5563; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; margin-top: 1.5rem; }
    .card { background: white; border-radius: 1rem; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #e5e7eb; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card-body { padding: 1.2rem; }
    .price { color: #059669; font-weight: bold; }
    footer { text-align: center; padding: 4rem 1.5rem; color: #6b7280; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="/images/logo.jpg" alt="SwePrint3D">
      <span>SwePrint3D</span>
    </a>
    <nav>
      <a href="/">Start</a>
      <a href="/butik.html">Butik</a>
      <a href="/priser-och-faq.html">Priser & FAQ</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ "now" | date: "%Y" }} SwePrint3D</p>
  </footer>
</body>
</html>
